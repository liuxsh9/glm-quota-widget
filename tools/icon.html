<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:transparent}
  #icon{
    width:512px;height:512px;border-radius:118px;position:relative;
    background:linear-gradient(145deg,#1a1d29,#101219 60%);
    box-shadow:0 24px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07);
  }
  /* 渐变圆环：约 35% 用量 */
  #icon .ring{
    position:absolute;inset:96px;border-radius:50%;
    background:conic-gradient(from -90deg,#22d3ee 0%,#8b5cf6 35%,rgba(255,255,255,.08) 35.2%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 46px),#000 calc(100% - 45px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 46px),#000 calc(100% - 45px));
    filter:drop-shadow(0 0 26px rgba(34,211,238,.45));
  }
  #icon .core{
    position:absolute;inset:0;display:grid;place-items:center;
    font:200px system-ui,sans-serif;color:#f0f2f7;
    text-shadow:0 0 40px rgba(139,92,246,.55);
  }
  /* 托盘 16px 级别小图 */
  #tray{
    width:32px;height:32px;border-radius:8px;background:#14161f;position:relative;
  }
  #tray .ring{
    position:absolute;inset:2px;border-radius:50%;
    background:conic-gradient(from -90deg,#22d3ee 0%,#22d3ee 36%,rgba(255,255,255,.12) 36.2%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4.5px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4.5px));
  }
</style>
<div id="icon"><div class="ring"></div><div class="core">◈</div></div>
<div id="tray"><div class="ring"></div></div>
