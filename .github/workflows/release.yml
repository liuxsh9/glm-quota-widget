name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          # CI 直连官方源（仓库 .npmrc 的国内镜像留给本地构建）
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Sanity check
        run: |
          node --check main.js
          node --check preload.js
          node --check lib/usage.js
          node --check lib/format.js

      - name: Enable exe icon edit (Windows 原生环境无需 wine)
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.build.win.signAndEditExecutable=true;fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: Build (installer + portable + zip)
        run: npx electron-builder --win nsis portable zip --x64 --publish never
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glm-quota-widget-win
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
