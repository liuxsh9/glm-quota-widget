<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:;">
<title>用量挂件</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="view-capsule" data-tier="low" data-pace="ok">

<!-- E · 迷你胶囊（常驻形态）：每家 provider 一列（顺序=注册表序），列由渲染层生成 -->
<section id="capsule" class="shell glass">
  <div class="hint hint-all"><span class="go">◈ 点击设置 Token ›</span></div>
</section>

<!-- B · 展开面板：页签按 provider 生成，视图由 panes.js 的工厂渲染 -->
<section id="panel" class="shell glass">
  <div class="phead">
    <span class="dot"></span>
    <div class="tabs" id="tabs" role="tablist"></div>
    <span class="upd" id="upd">–</span>
    <button class="ico" id="refBtn2" title="立即刷新">⟳</button>
    <button class="ico" id="gearBtn" title="设置">⚙</button>
  </div>
  <div class="acc-row" id="accRow" hidden></div>
  <div id="panes"></div>

  <div class="banner banner-expired">⚠ 凭据已失效 <a id="fixBtn">去更新 ›</a></div>
  <div class="banner banner-retry"><span id="errMsg">更新失败</span> <a id="retryBtn">重试 ›</a></div>
  <div id="zoomTip" hidden></div>
</section>

<!-- G · 设置：provider 分段由 settings.js 按 GLMPROV 元数据生成，通用段静态 -->
<section id="settings" class="shell glass">
  <div class="shead">
    <button class="back" id="backBtn">‹ 返回</button>
    <h3>设置</h3>
    <span class="savetip" id="saveTip">✓ 已保存</span>
    <button class="btn pri hsave" id="saveBtn2">保存并刷新</button>
  </div>
  <div class="sbody">
    <div id="provSecs"></div>

    <h4 class="sech">通用</h4>
    <p class="hintline">本段的开关与下拉都是<b>改完立即生效并保存</b>；账户凭据在各家分段里保存。</p>
    <div class="grid">
      <label>配额 / 账单刷新
        <select id="interval">
          <option value="5">每 5 分钟</option>
          <option value="10" selected>每 10 分钟（推荐）</option>
          <option value="15">每 15 分钟</option>
          <option value="30">每 30 分钟</option>
          <option value="0">仅手动</option>
        </select>
      </label>
      <label>界面主题
        <select id="theme">
          <option value="auto" selected>自动（跟随背景明暗）</option>
          <option value="dark">强制深色玻璃</option>
          <option value="light">强制浅色玻璃</option>
        </select>
      </label>
      <label id="caplayoutWrap">胶囊布局
        <select id="caplayout">
          <option value="switch" selected>切换（只显示当前账户）</option>
          <option value="all">平铺（每个账户各一格）</option>
        </select>
      </label>
    </div>
    <p class="hintline">配额与平台账单走这个频率。这些接口有限流/风控，所以不建议更快。</p>
    <p class="hintline" id="caplayoutHint" hidden>「切换」时点胶囊上的账户标签可切换账户，滚轮也能直接切；「平铺」把每个账户各排一格，一眼看全（点账户名可把它设为当前账户）。</p>
    <label class="tgl"><input type="checkbox" id="autostart" checked>开机自动启动</label>
    <label class="tgl"><input type="checkbox" id="ontop" checked>悬浮窗置顶显示</label>
    <div class="btns">
      <button class="btn pri" id="saveBtn">保存并刷新</button>
    </div>
    <p class="note">自动刷新带 ±20s 随机抖动，另有托盘「立即刷新」；请求直连各官方域名，不会被 CORS 拦截。所有凭据只保存在本机 <code>config.json</code>，不会外发。</p>
  </div>
</section>

<script src="../lib/format.js"></script>
<script src="../lib/providers/meta.js"></script>
<script src="panes.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
</body>
</html>
